steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - --pull
      - --build-arg=SITE_URL=${_SITE_URL}
      - --build-arg=SITE_INDEXING_ENABLED=${_SITE_INDEXING_ENABLED}
      - --build-arg=CONTENT_API_URL=${_CONTENT_API_URL}
      - --build-arg=NEXT_PUBLIC_CONTENT_API_URL=${_CONTENT_API_URL}
      - --build-arg=NEXT_PUBLIC_FIREBASE_API_KEY=${_FIREBASE_API_KEY}
      - --build-arg=NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=${_FIREBASE_AUTH_DOMAIN}
      - --build-arg=NEXT_PUBLIC_FIREBASE_PROJECT_ID=the49-487609
      - --build-arg=NEXT_PUBLIC_FIREBASE_APP_ID=${_FIREBASE_APP_ID}
      - --build-arg=NEXT_PUBLIC_GTM_ID=${_GTM_ID}
      - --tag
      - asia-southeast1-docker.pkg.dev/the49-487609/ddbox/web:${_IMAGE_TAG}
      - .
  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - asia-southeast1-docker.pkg.dev/the49-487609/ddbox/web:${_IMAGE_TAG}
images:
  - asia-southeast1-docker.pkg.dev/the49-487609/ddbox/web:${_IMAGE_TAG}
serviceAccount: projects/the49-487609/serviceAccounts/ddbox-deployer@the49-487609.iam.gserviceaccount.com
logsBucket: gs://the49-487609-ddbox-build/logs/web-prod
options:
  logging: GCS_ONLY
  machineType: E2_HIGHCPU_8
substitutions:
  _SITE_INDEXING_ENABLED: "true"
  _GTM_ID: "GTM-MWW3HWHR"
