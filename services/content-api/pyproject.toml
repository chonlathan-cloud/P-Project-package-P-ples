[project]
name = "ddbox-content-api"
version = "0.1.0"
description = "DD Box Printing content, media, and lead API"
requires-python = ">=3.13,<3.14"
dependencies = [
  "fastapi==0.141.1",
  "email-validator>=2.3,<3",
  "firebase-admin==7.5.0",
  "google-cloud-firestore==2.29.0",
  "google-cloud-storage>=3.4,<4",
  "google-cloud-tasks>=2.20,<3",
  "httpx>=0.28,<1",
  "pillow>=12.0,<13",
  "pydantic-settings>=2.11,<3",
  "python-multipart>=0.0.20,<1",
  "uvicorn[standard]>=0.38,<1",
]

[dependency-groups]
dev = [
  "mypy>=1.18,<2",
  "pytest>=9.0,<10",
  "pytest-cov>=7.0,<8",
  "ruff>=0.14,<1",
]

[build-system]
requires = ["hatchling>=1.28,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ddbox_api"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "S", "RUF"]
ignore = ["S101"]

[tool.mypy]
python_version = "3.13"
strict = true
packages = ["ddbox_api"]

[[tool.mypy.overrides]]
module = ["firebase_admin", "firebase_admin.*", "google.cloud.storage", "google.cloud.storage.*"]
ignore_missing_imports = true
